services:
  nvs-db:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-nvs-db}
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker} -d ${POSTGRES_DB:-nvs-db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: nvs_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nvs-db:5432/${POSTGRES_DB:-nvs-db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-docker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SLA_TIME_ZONE: ${SLA_TIME_ZONE:-America/Recife}
      SLA_HOLIDAYS: ${SLA_HOLIDAYS:-}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      nvs-db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:${SERVER_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: nvs_frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
