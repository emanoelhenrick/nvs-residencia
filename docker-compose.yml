services:
  nvs-db:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=nvs-db
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: nvs_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nvs-db:5432/nvs-db

      SPRING_DATASOURCE_USERNAME: docker
      SPRING_DATASOURCE_PASSWORD: docker
      JWT_SECRET: NVS_ULTIMATE_SECRET_KEY
    ports:
      - "8080:8080"
    depends_on:
      - nvs-db
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: nvs_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
