<div class="page">
  <app-page-header
    title="Dashboard"
    [subtitle]="'Visão geral da operação · Última atualização: ' + stamp()"
  >
    @if (canOpen()) {
      <a routerLink="/new-ticket" class="btn btn-primary">Abrir chamado</a>
    }
  </app-page-header>

  @if (loading()) {
    <p class="muted" role="status">Carregando indicadores…</p>
  } @else if (error()) {
    <app-empty-state icon="alert" title="Não foi possível carregar o dashboard">
      A consulta falhou. Confira a conexão e tente novamente.
      <button actions type="button" class="btn btn-primary" (click)="load()">Tentar novamente</button>
    </app-empty-state>
  } @else {
    <app-dashboard-kpis
      [total]="total()"
      [triage]="triage()"
      [attention]="attentionCount()"
      [violated]="violatedCount()"
      [paused]="pausedCount()"
    />

    @if (alert(); as a) {
      <div style="margin-top: 16px"><app-sla-alert [row]="a" /></div>
    }

    <section class="charts">
      <app-priority-chart-card [total]="total()" [buckets]="priorities()" />
      <app-status-board-card [total]="total()" [board]="board()" />
      <app-sla-breakdown-card [items]="breakdown()" />
    </section>

    <app-attention-section [rows]="attention()" [units]="units()" [now]="now()" />
    <app-recent-updates [updates]="recent()" />
  }
</div>
