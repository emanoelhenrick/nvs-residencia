<div class="page">
  <app-page-header
    title="Triagem"
    [subtitle]="'Fila N1 · Classificação e atribuição · Visão de ' + stamp()"
  />
  @if (error()) {
    <app-empty-state icon="alert" title="Não foi possível carregar a fila de triagem">
      A consulta falhou. Confira a conexão e tente novamente.
      <button actions type="button" class="btn btn-primary" (click)="load()">Tentar novamente</button>
    </app-empty-state>
  } @else if (loading()) {
    <p class="muted" role="status">Carregando fila…</p>
  } @else {
    <div class="layout">
      <app-triage-queue
        [items]="queue()"
        [units]="units()"
        [selectedId]="selected()?.id ?? null"
        (select)="picked.set($event)"
      />
      @if (selected(); as t) {
        <app-classify-form
          [ticket]="t"
          [units]="units()"
          (saved)="onSaved()"
          (changed)="load()"
        />
      } @else {
        <section class="card">
          <h2>Nada a classificar</h2>
          <p class="muted" style="margin-top: 8px">
            Todos os chamados da fila já foram classificados e atribuídos.
          </p>
        </section>
      }
    </div>
    <div class="stack" style="margin-top: 16px">
      @for (g of groups(); track g.key) {
        <app-incident-panel [group]="g" [units]="units()" (changed)="load()" />
      }
    </div>
  }
</div>
