<div class="host" aria-live="polite">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast" [class]="'toast ' + t.variant">
      <app-icon
        [name]="t.variant === 'success' ? 'check-circle' : t.variant === 'error' ? 'alert' : 'info'"
      />
      <span>{{ t.text }}</span>
      <button type="button" aria-label="Fechar" (click)="toast.dismiss(t.id)">
        <app-icon name="x" [size]="14" />
      </button>
    </div>
  }
</div>
