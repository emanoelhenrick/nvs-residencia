<span class="small">{{ summary() }}</span>
<div class="row">
  <button type="button" class="btn" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
    Anterior
  </button>
  <span>Página {{ page() }} de {{ pages() }}</span>
  <button
    type="button"
    class="btn"
    [disabled]="page() >= pages()"
    (click)="pageChange.emit(page() + 1)"
  >
    Próxima
  </button>
</div>
