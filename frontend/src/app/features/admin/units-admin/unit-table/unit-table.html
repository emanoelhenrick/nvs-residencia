<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>ID da unidade</th>
        <th>Tipo</th>
        <th>Localidade</th>
        <th>Responsável local</th>
        <th><span class="sr-only">Ações</span></th>
      </tr>
    </thead>
    <tbody>
      @for (u of units(); track u.id) {
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.type }}</td>
          <td>{{ u.city }} · {{ u.uf }}</td>
          <td>{{ u.manager }}</td>
          <td>
            <button type="button" class="btn btn-sm" (click)="edit.emit(u)">Editar</button>
            <button
              type="button"
              class="btn btn-sm btn-danger"
              style="margin-left: 10px"
              (click)="delete.emit(u)"
            >
              Excluir
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="muted">Nenhuma unidade cadastrada.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
