<nav class="sidebar" [class.collapsed]="!layout.sidebarOpen()" aria-label="Navegação principal">
  <div class="sidebar-header">
    <button
      type="button"
      class="toggle-btn"
      [attr.aria-label]="layout.sidebarOpen() ? 'Recolher menu' : 'Expandir menu'"
      [attr.aria-expanded]="layout.sidebarOpen()"
      (click)="layout.toggleSidebar()"
    >
      <mat-icon>{{ layout.sidebarOpen() ? 'chevron_left' : 'menu' }}</mat-icon>
    </button>
  </div>

  <ul class="nav-list">
    @for (item of items; track item.route) {
    <li>
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [attr.title]="!layout.sidebarOpen() ? item.label : null"
      >
        @if (item.icon) {
        <mat-icon class="icon" aria-hidden="true">{{ item.icon }}</mat-icon>
        }
        <span class="label">{{ item.label }}</span>
      </a>
    </li>
    }
  </ul>
</nav>
