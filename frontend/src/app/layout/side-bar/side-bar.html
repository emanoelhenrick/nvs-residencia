<nav class="side" [class.open]="ui.mobileMenu()" aria-label="Navegação principal">
  <div>
    <div class="ws">
      <span class="small muted caps">Espaço de trabalho</span>
      <strong>{{ workspace() }}</strong>
    </div>
    <ul>
      @for (i of nav(); track i.path) {
        <li>
          <a [routerLink]="i.path" routerLinkActive="active" [title]="i.label" (click)="close()">
            <app-icon [name]="i.icon" />
            <span class="lbl">{{ i.label }}</span>
            <app-icon class="tick" name="check" [size]="16" />
          </a>
        </li>
      }
    </ul>
  </div>
  <div>
    <p class="small muted note">
      Consulta restrita ao seu perfil. Decisões ficam registradas no histórico.
    </p>
    <button type="button" class="logout" (click)="logout()">Sair da sessão</button>
  </div>
</nav>
