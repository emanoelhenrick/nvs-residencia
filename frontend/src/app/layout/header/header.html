<header class="bar">
  <div class="left">
    <button type="button" class="icon-btn" aria-label="Alternar menu" (click)="toggleMenu()">
      <app-icon name="menu" />
    </button>
    <a routerLink="/dashboard" class="logo"
      ><img src="assets/logo-nexo.png" alt="Nexo Varejo" height="40"
    /></a>
    <a routerLink="/dashboard" class="app">Central de operações</a>
  </div>
  <div class="right">
    <div class="rel">
      <button
        type="button"
        class="icon-btn"
        aria-label="Notificações"
        (click)="toggleNotifications()"
      >
        <app-icon name="bell" />
        @if (unread() > 0) {
          <span class="dot">{{ unread() }}</span>
        }
      </button>
      @if (ui.notificationsOpen()) {
        <app-notifications-panel
          [notifications]="notifications()"
          (opened)="open($event)"
          (readAll)="readAll()"
          (closed)="ui.notificationsOpen.set(false)"
        />
      }
    </div>
    <span class="user">{{ label() }}</span>
  </div>
</header>
